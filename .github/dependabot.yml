version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    # Wait for new releases to settle. Security updates skip the cooldown.
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Types track the Node major in .nvmrc; bump both together by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # drizzle-orm and drizzle-kit are 0.x, where a minor release can break
      # things, and the migrator's journal and hash behavior is pinned by
      # scripts/db/. Upgrade them by hand, together, with a migration review;
      # patch releases still come through.
      - dependency-name: "drizzle-orm"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "drizzle-kit"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      # eslint-config-next must match the next version exactly.
      nextjs:
        patterns: ["next", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@vitejs/plugin-react"
          - "jsdom"
          - "@testing-library/*"
      # New Prettier versions can reformat code and fail the format check, so
      # keep them out of the batch below.
      prettier:
        patterns: ["prettier", "prettier-plugin-*"]
      dev-minor-and-patch:
        dependency-type: "development"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
