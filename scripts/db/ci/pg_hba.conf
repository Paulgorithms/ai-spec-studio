# AI Specification Studio: client authentication for the disposable CI
# PostgreSQL 18 cluster on a GitHub-hosted Ubuntu 26.04 runner ONLY.
#
# Installed by scripts/db/ci-provision-postgres.sh as the cluster's
# pg_hba.conf before the server starts. Never install it on a developer's
# server: scripts/db/local-setup.sql and scripts/db/README.md cover those.
#
# PostgreSQL uses the first record that matches and never falls through, so
# the two narrow records that allow anything come first and everything after
# them rejects:
#   1. postgres (the built-in administrator) over the Unix socket, peer:
#      the OS user postgres, through sudo. No password exists or is used.
#   2. ai_spec_studio_test to ai_spec_studio_test only, from 127.0.0.1 only,
#      without TLS (the CI server runs with ssl = off), with SCRAM-SHA-256.
#   3-8. Explicit rejects for every other socket, IPv4, IPv6, and physical
#      replication connection. ("all" never matches a physical replication
#      connection, so those need their own records.)
#
# TYPE     DATABASE             USER                 ADDRESS         METHOD
local      all                  postgres                             peer
hostnossl  ai_spec_studio_test  ai_spec_studio_test  127.0.0.1/32    scram-sha-256
local      all                  all                                  reject
local      replication          all                                  reject
host       all                  all                  0.0.0.0/0       reject
host       replication          all                  0.0.0.0/0       reject
host       all                  all                  ::/0            reject
host       replication          all                  ::/0            reject
