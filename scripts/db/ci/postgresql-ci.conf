# AI Specification Studio: server settings for the disposable CI PostgreSQL
# 18 cluster on a GitHub-hosted Ubuntu 26.04 runner ONLY.
#
# Installed by scripts/db/ci-provision-postgres.sh into the cluster's
# conf.d directory, which must be empty beforehand. postgresql.conf reads
# conf.d last, so these values replace the packaged ones; ci-setup.sql then
# confirms that each one comes from this file (pg_settings.sourcefile).
#
# - TCP on 127.0.0.1 only: no other interface, no IPv6.
# - No TLS: the test URL and the session checks require a plain loopback
#   session, and pg_hba.conf allows hostnossl only.
# - Passwords stored as SCRAM-SHA-256 verifiers.
# - No statement text in the server log, even for a failing statement, so a
#   statement carrying the test role's verifier is never written there.

listen_addresses = '127.0.0.1'
ssl = off
password_encryption = 'scram-sha-256'
log_min_error_statement = panic
log_statement = none
